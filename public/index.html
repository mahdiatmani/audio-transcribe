    <script>
      // Cookie Consent Management for AdSense 2026 Compliance (Google Consent Mode v2)
      (function() {
        var consent = localStorage.getItem('cookie_consent');
        var banner = document.getElementById('cookie-consent-banner');

        if (!consent && banner) {
          banner.style.display = 'block';
        }

        // Initialize Google Consent Mode v2
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        // Default consent state (denied until user accepts)
        gtag('consent', 'default', {
          'ad_storage': 'denied',
          'ad_user_data': 'denied',
          'ad_personalization': 'denied',
          'analytics_storage': consent === 'all' ? 'granted' : 'denied',
          'functionality_storage': 'granted',
          'personalization_storage': 'denied',
          'security_storage': 'granted',
          'wait_for_update': 500
        });

        // If user already consented, update consent
        if (consent === 'all') {
          gtag('consent', 'update', {
            'ad_storage': 'granted',
            'ad_user_data': 'granted',
            'ad_personalization': 'granted',
            'analytics_storage': 'granted',
            'personalization_storage': 'granted'
          });
        } else if (consent === 'essential') {
          gtag('consent', 'update', {
            'analytics_storage': 'granted'
          });
        }
      })();

      function handleCookieConsent(type) {
        localStorage.setItem('cookie_consent', type);
        localStorage.setItem('cookie_consent_date', new Date().toISOString());

        var banner = document.getElementById('cookie-consent-banner');
        if (banner) {
          banner.style.display = 'none';
        }

        // Update Google Consent Mode
        if (type === 'all') {
          gtag('consent', 'update', {
            'ad_storage': 'granted',
            'ad_user_data': 'granted',
            'ad_personalization': 'granted',
            'analytics_storage': 'granted',
            'personalization_storage': 'granted'
          });
        } else {
          gtag('consent', 'update', {
            'analytics_storage': 'granted'
          });
        }

        // Reload ads if consent granted
        if (type === 'all' && typeof adsbygoogle !== 'undefined') {
          try {
            (adsbygoogle = window.adsbygoogle || []).push({});
          } catch(e) {}
        }
      }
